name: CodeQL

on:
  schedule:
    - cron: "10 6 19 * *"  # monthly scattered (was: 42 15 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      languages: "go"
